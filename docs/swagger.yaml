      summary: Soft delete achievement
      tags:
      - Achievement
    get:
      description: Mengambil detail achievement berdasarkan ID
      parameters:
      - description: Achievement ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
