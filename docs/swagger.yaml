basePath: /api/v1
definitions:
  model.AchievementHistory:
    properties:
      rejection_note:
        type: string
      status:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  model.AchievementSwagger:
    properties:
      achievement_type:
        type: string
      created_at:
        type: string
      description:
        type: string
      details:
        additionalProperties: true
        type: object
      id:
        type: string
      points:
        type: integer
      status:
        type: string
      student_id:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.BaseResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
  model.CreateAchievement:
    type: object
  model.Lecturer:
    properties:
      created_at:
        type: string
      department:
        type: string
      id:
        type: string
      lecturer_id:
        type: string
      user_id:
        type: string
    type: object
  model.LecturerProfileDTO:
    properties:
      department:
        type: string
      lecturer_id:
        type: string
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  model.RefreshClaims:
    type: object
  model.Student:
    properties:
      academic_year:
        type: string
      advisor_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      program_study:
        type: string
      student_id:
        type: string
      user_id:
        type: string
    type: object
  model.StudentProfileDTO:
    properties:
      academic_year:
        type: string
      advisor_id:
        type: string
      program_study:
        type: string
      student_id:
        type: string
    type: object
  model.StudentResponse:
    properties:
      full_name:
        type: string
      id:
        type: string
      program_study:
        type: string
      student_id:
        type: string
    type: object
  model.UpdateAdvisorRequest:
    properties:
      advisor_id:
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      password_hash:
        type: string
      role_id:
        type: string
      student_id:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.UserDTO:
    properties:
      email:
        type: string
      full_name:
        type: string
      lecturer_profile:
        $ref: '#/definitions/model.LecturerProfileDTO'
      password:
        type: string
      role_id:
        type: string
      student_profile:
        $ref: '#/definitions/model.StudentProfileDTO'
      username:
        type: string
    type: object
  model.VerifyAchievement:
    properties:
      points:
        type: integer
      verified_at:
        type: string
      verified_by:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: Dokumentasi REST API Pelaporan Prestasi
  title: Pelaporan Prestasi API
  version: "1.0"
paths:
  /api/v1/achievements:
    get:
      description: Mengambil achievement berdasarkan role (Admin / Mahasiswa / Dosen
        Wali)
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Limit data
        in: query
        name: limit
        type: integer
      - description: Sort field
        in: query
        name: sort
        type: string
      - description: ASC / DESC
        in: query
        name: order
        type: string
      - description: Achievement status
        in: query
        name: status
        type: string
      - description: Student name
        in: query
        name: student_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get achievements by role
      tags:
      - Achievement
    post:
      consumes:
      - application/json
      description: 'Mahasiswa membuat achievement (status awal: draft)'
      parameters:
      - description: Create Achievement Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateAchievement'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.AchievementSwagger'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create achievement
      tags:
      - Achievement
  /api/v1/achievements/{id}:
    delete:
      description: Menghapus achievement (soft delete)
      parameters:
      - description: Achievement ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
