            - properties:
                data:
                  additionalProperties:
                    $ref: '#/definitions/model.AchievementSwagger'
                  type: object
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get achievement detail
      tags:
      - Achievement
    put:
      consumes:
      - multipart/form-data
      description: Update achievement (multipart form, termasuk attachment)
      parameters:
      - description: Achievement ID
        in: path
        name: id
        required: true
        type: string
      - description: Title
        in: formData
        name: title
        type: string
      - description: Description
        in: formData
        name: description
        type: string
      - description: Status
        in: formData
        name: status
        type: string
      - description: JSON details
        in: formData
        name: details
        type: string
      - description: JSON tags
        in: formData
        name: tags
        type: string
      - description: Points
        in: formData
        name: points
        type: integer
      - description: Attachments
        in: formData
        name: attachments
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.BaseResponse'
      security:
      - BearerAuth: []
      summary: Update achievement
      tags:
      - Achievement
  /api/v1/achievements/{id}/attachments:
